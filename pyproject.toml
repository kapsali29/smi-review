[project]
name = "smi-index-review"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "pandas>=2.3.3",
    "pandas-stubs>=2.2.2.240807",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.11.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20250915",
    "uvicorn>=0.39.0",
]

[project.scripts]
smi-index-review = "smi_index_review:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "ruff>=0.16.9",
]
