services:
  smi_api:
    container_name: smi_api
    hostname: smi_api
    build: .
    ports:
      - "8000:8000"
    command: ["uvicorn", "smi_index_review.api.index:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data/:/app/data
      - ./output:/app/output
    restart: unless-stopped
